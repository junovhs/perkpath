[package]
name = "perkpath"
version = "0.1.0"
edition = "2021"

[dependencies]
# Disable default features to prevent 'devtools' (hot-reload client) from being included.
# Trunk handles the page reloading for us.
dioxus = { version = "0.6", default-features = false, features = ["web"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
