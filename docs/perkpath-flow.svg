<svg width="1220" height="310" viewBox="0 0 1220 310" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">PerkPath workflow</title>
  <desc id="desc">A five-step workflow from itinerary text to AI prompt, structured JSON, route map, and exportable assets.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <linearGradient id="accent" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#00B4D8"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2 L10 6 L2 10" fill="none" stroke="#64748B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .bg{fill:#F8FAFC}.card{fill:white;stroke:#E2E8F0;stroke-width:1.5;filter:url(#shadow)}
      .title{font-family:Inter,Arial,sans-serif;font-size:22px;font-weight:700;fill:#0F172A}
      .copy{font-family:Inter,Arial,sans-serif;font-size:14px;font-weight:500;fill:#475569}
      .num{font-family:Inter,Arial,sans-serif;font-size:13px;font-weight:800;fill:white}
      .pill{fill:url(#accent)}.line{stroke:#64748B;stroke-width:2.5;marker-end:url(#arrow)}
      .caption{font-family:Inter,Arial,sans-serif;font-size:17px;font-weight:700;fill:#0F172A}
      .sub{font-family:Inter,Arial,sans-serif;font-size:13px;fill:#64748B}
    </style>
  </defs>
  <rect class="bg" width="1220" height="310" rx="28"/>
  <text x="54" y="54" class="caption">PerkPath turns messy travel copy into a publication-ready route map.</text>
  <text x="54" y="80" class="sub">The app keeps the AI step explicit, then makes rendering, refinement, saving, and export deterministic.</text>

  <g transform="translate(54 125)">
    <rect class="card" width="160" height="122" rx="18"/>
    <circle class="pill" cx="30" cy="30" r="15"/><text x="26" y="35" class="num">1</text>
    <text x="24" y="72" class="title">Itinerary</text>
    <text x="24" y="98" class="copy">Paste raw travel text</text>
  </g>
  <line x1="230" y1="186" x2="278" y2="186" class="line"/>
  <g transform="translate(292 125)">
    <rect class="card" width="160" height="122" rx="18"/>
    <circle class="pill" cx="30" cy="30" r="15"/><text x="26" y="35" class="num">2</text>
    <text x="24" y="72" class="title">Prompt</text>
    <text x="24" y="98" class="copy">Generate LLM brief</text>
  </g>
  <line x1="468" y1="186" x2="516" y2="186" class="line"/>
  <g transform="translate(530 125)">
    <rect class="card" width="160" height="122" rx="18"/>
    <circle class="pill" cx="30" cy="30" r="15"/><text x="26" y="35" class="num">3</text>
    <text x="24" y="72" class="title">JSON</text>
    <text x="24" y="98" class="copy">Locations + segments</text>
  </g>
  <line x1="706" y1="186" x2="754" y2="186" class="line"/>
  <g transform="translate(768 125)">
    <rect class="card" width="160" height="122" rx="18"/>
    <circle class="pill" cx="30" cy="30" r="15"/><text x="26" y="35" class="num">4</text>
    <text x="24" y="72" class="title">Map</text>
    <text x="24" y="98" class="copy">Render, tune, save</text>
  </g>
  <line x1="944" y1="186" x2="992" y2="186" class="line"/>
  <g transform="translate(1006 125)">
    <rect class="card" width="160" height="122" rx="18"/>
    <circle class="pill" cx="30" cy="30" r="15"/><text x="26" y="35" class="num">5</text>
    <text x="24" y="72" class="title">Export</text>
    <text x="24" y="98" class="copy">High-res PNG assets</text>
  </g>
</svg>
