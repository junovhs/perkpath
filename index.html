<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>PerkPath</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <!-- Trunk: Bundle CSS -->
  <link data-trunk rel="css" href="assets/style.css" />
  <link data-trunk rel="css" href="assets/ui.css" />
  
  <!-- Trunk: Copy Assets Folder (Preserves JS files for script tags below) -->
  <link data-trunk rel="copy-dir" href="assets" />
  
  <!-- Trunk: Copy Redirects for Cloudflare -->
  <link data-trunk rel="copy-file" href="_redirects" />
</head>
<body>
  <div id="main"></div>
  <link data-trunk rel="rust" data-wasm-opt="z" />
  
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <!-- Load Logic First -->
  <script src="assets/leader-lines.js"></script>
  <script src="assets/renderer.js"></script>
  <!-- Load Bridge Last -->
  <script src="assets/interop.js"></script>
</body>
</html>
